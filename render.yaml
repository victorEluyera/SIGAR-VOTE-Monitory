services:
  - type: web
    name: election-monitor-command-center
    runtime: docker
    plan: starter
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_FILE
        value: /data/data.json
      - key: JWT_SECRET
        generateValue: true
      # Must match the public Render URL so browser requests are not accepted
      # from arbitrary origins. Override this value if the service name changes.
      - key: CORS_ORIGIN
        value: https://e-monitoring.onrender.com
      - key: IREV_AUTO_SYNC
        value: "false"
      - key: OYO10X_API_URL
        value: https://oyo10x.oyoahead.com/api/external/v1
      - key: OYO10X_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ADMIN_EMAIL
        value: admin@command.local
      - key: ADMIN_PASSWORD
        sync: false
      - key: SUPER_ADMIN_EMAIL
        value: superadmin@command.local
      - key: SUPER_ADMIN_PASSWORD
        sync: false
      - key: CLOUDFLARE_TURN_KEY_ID
        sync: false
      - key: CLOUDFLARE_TURN_API_TOKEN
        sync: false
      - key: CLOUDFLARE_TURN_TTL
        value: "86400"
      - key: EXPRESSTURN_URLS
        sync: false
      - key: EXPRESSTURN_USERNAME
        sync: false
      - key: EXPRESSTURN_PASSWORD
        sync: false
    disk:
      name: election-monitor-data
      mountPath: /data
      sizeGB: 1
